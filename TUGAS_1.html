<!DOCTYPE html>
<html>
<body>
    <h2>Penentuan Grade Nilai</h2>
    <script>
        let nama = prompt("Masukkan Nama Siswa:");
        let nilai = Number(prompt("Masukkan Nilai Angka (0-100):"));
        let grade = "";

        if (nilai >= 85) {
            grade = "A";
        } else if (nilai >= 75) {
            grade = "B";
        } else if (nilai >= 60) {
            grade = "C";
        } else {
            grade = "D";
        }

        document.write("Nama Siswa : " + nama + "<br>");
        document.write("Nilai Angka: " + nilai + "<br>");
        document.write("Grade      : <b>" + grade + "</b>");
    </script>
</body>
</html>
